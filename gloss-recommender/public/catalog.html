<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글로스·문진 현황 · 수어 글로스 추천기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">
  <div class="main wide">
    <div class="app-header">
      <div>
        <h1>글로스·문진 현황</h1>
        <p>최근 출력 글로스와 전체 글로스 DB, 모든 문진단계·세부분류의 데이터 현황입니다.</p>
      </div>
      <nav class="app-nav">
        <a class="app-link" href="analysis.html">분석 페이지</a>
        <a class="app-link" href="index.html">← 추천 화면</a>
      </nav>
    </div>
    <div id="page"><div class="card"><span class="spinner"></span>데이터를 불러오는 중...</div></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  let catalog = null;

  function section(title, inner, note = '') {
    return `<div class="card"><div class="card-title">${escapeHtml(title)}</div>${inner}
      ${note ? `<div class="card-note">${escapeHtml(note)}</div>` : ''}</div>`;
  }

  function latestOutputHtml() {
    const run = loadRun();
    const items = run?.recommend?.keywordCandidates || [];
    if (!items.length) return '<div class="empty-note">추천 화면에서 질문을 실행하면 여기에 최근 출력 목록이 표시됩니다.</div>';
    const rows = items.map((item, index) => `<tr>
      <td class="row-number">${index + 1}</td>
      <td class="gl">${escapeHtml(item.gloss || item.name || '-')}</td>
      <td>${escapeHtml(String(item.glossIndex ?? item.origin ?? '-'))}</td>
      <td>${escapeHtml(String(item.score ?? '-'))}</td>
    </tr>`).join('');
    return `<div class="latest-question">${escapeHtml(run.question || '')} · ${escapeHtml(run.stage || '')} / ${escapeHtml(run.subCategory || '')}</div>
      <div class="table-scroll"><table class="table compact-table">
        <thead><tr><th>#</th><th>글로스</th><th>ID</th><th>스코어</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  function summaryHtml() {
    const cards = [
      ['전체 글로스', catalog.totalGlosses, '개'],
      ['의미 부류 배정', catalog.assignedGlosses, '개'],
      ['미배정 글로스', catalog.unassignedGlosses, '개'],
      ['문진단계', catalog.totalStages, '개'],
      ['세부분류', catalog.totalSubCategories, '개'],
      ['질문 / 답변', `${catalog.totalQuestions} / ${catalog.totalAnswers}`, '개'],
    ];
    return `<div class="stat-grid">${cards.map(([label, value, unit]) =>
      `<div class="stat-card"><span>${escapeHtml(label)}</span><strong>${escapeHtml(String(value))}</strong><small>${unit}</small></div>`).join('')}</div>`;
  }

  function stagesHtml() {
    const rows = (catalog.stages || []).map((item, index) => `<tr>
      <td class="row-number">${index + 1}</td>
      <td><strong>${escapeHtml(item.stage)}</strong></td>
      <td>${escapeHtml(item.subCategory)}</td>
      <td>${item.questionCount}</td><td>${item.answerCount}</td>
      <td>${escapeHtml((item.primarySets || []).join(', ') || '-')}</td>
      <td>${escapeHtml((item.secondarySets || []).join(', ') || '-')}</td>
    </tr>`).join('');
    return `<div class="table-scroll stage-table-scroll"><table class="table stage-table">
      <thead><tr><th>#</th><th>문진단계</th><th>세부분류</th><th>질문</th><th>답변</th><th>주 의미 부류</th><th>보조 의미 부류</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  function glossesHtml(query = '') {
    const normalized = query.trim().toLowerCase();
    const items = (catalog.glosses || []).filter(item => !normalized ||
      `${item.gloss} ${item.glossId} ${item.category} ${(item.synonyms || []).join(' ')}`.toLowerCase().includes(normalized));
    const rows = items.map((item, index) => `<tr>
      <td class="row-number">${index + 1}</td><td>${item.glossId}</td>
      <td class="gl">${escapeHtml(item.gloss)}</td>
      <td>${escapeHtml((item.synonyms || []).join(', ') || '-')}</td>
      <td>${escapeHtml(item.category || '-')}</td>
    </tr>`).join('');
    document.getElementById('glossCount').textContent = `${items.length}개 표시`;
    document.getElementById('glossRows').innerHTML = rows || '<tr><td colspan="5">검색 결과 없음</td></tr>';
  }

  function render() {
    document.getElementById('page').innerHTML =
      section('전체 현황', summaryHtml()) +
      section('최근 출력 글로스 · ID 목록', latestOutputHtml(), '최근 추천 결과와 별도로 글로스, ID, 스코어만 확인합니다.') +
      section(`모든 문진단계·세부분류 (${catalog.totalSubCategories}개)`, stagesHtml()) +
      section(`전체 글로스 DB (${catalog.totalGlosses}개)`, `
        <div class="catalog-toolbar"><input id="glossSearch" type="search" placeholder="글로스, ID, 분류 검색" oninput="glossesHtml(this.value)" /><span id="glossCount"></span></div>
        <div class="table-scroll catalog-table-scroll"><table class="table catalog-table">
          <thead><tr><th>#</th><th>ID</th><th>글로스</th><th>유의어</th><th>분류</th></tr></thead>
          <tbody id="glossRows"></tbody></table></div>`);
    glossesHtml();
  }

  fetch('/api/gloss-catalog').then(async response => {
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    catalog = data;
    render();
  }).catch(error => {
    document.getElementById('page').innerHTML = `<div class="card"><div class="notice error">${escapeHtml(error.message)}</div></div>`;
  });
</script>
</body>
</html>
