# Gloss Recommender — nginx reverse proxy (bridge network)
# - /           → static UI
# - /api/       → api:3100
# - /data/      → dataset-builder/data
# - /ollama/    → ollama:11434
# - /omniserve/ → host의 선택적 OpenAI-compatible backend:8000

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        alias /var/www/data/;
        default_type application/octet-stream;
        types {
            application/json json;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
            text/csv csv;
            text/markdown md;
        }
        add_header Cache-Control "no-store";
    }

    location /api/ {
        set $api_upstream http://api:3100;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ollama/ {
        set $ollama_upstream http://ollama:11434;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass $ollama_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /omniserve/ {
        set $omniserve_upstream http://host.docker.internal:8000;
        rewrite ^/omniserve/(.*)$ /$1 break;
        proxy_pass $omniserve_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
