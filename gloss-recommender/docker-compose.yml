# 저장소 루트의 compose와 같다. 이 디렉터리에서 실행해도 된다.
name: gloss-recommender

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    ports:
      - "11435:11434"
    environment:
      OLLAMA_ORIGINS: "*"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      ollama pull qwen3:14b
      ollama pull bge-m3
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: gloss-recommender/Dockerfile.api
    environment:
      PORT: "3100"
      OLLAMA_URL: http://ollama:11434
      OMNISERVE_URL: http://host.docker.internal:8000/a/v1
      OPENAI_COMPATIBLE_URL: http://host.docker.internal:8000/v1
      QUESTION_ANSWER_POOL: /data/llm_pipeline/question_answer_pool.json
      LLM_GLOSS_VECTOR_DB: /data/llm_pipeline/test_658_gloss_vector_db.json
      QUESTION_RETRIEVAL_INDEX: /data/llm_pipeline/question_retrieval_index.json
      KEYWORD_GLOSS_MAP: /data/llm_pipeline/keyword_gloss_map.json
      INTENT_GLOSS_SETS: /data/llm_pipeline/intent_gloss_sets.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: gloss-recommender/Dockerfile
    ports:
      - "8777:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped
